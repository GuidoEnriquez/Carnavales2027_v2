name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: carnavales2027_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run Better Auth Migrations
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
          BETTER_AUTH_SECRET: ci-secret-value-that-is-at-least-32-characters-long!
          BETTER_AUTH_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:5173
        run: npm run auth:migrate

      - name: Run Database Migrations
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
        run: npm run db:migrate

      - name: Run API Tests
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
          BETTER_AUTH_SECRET: ci-secret-value-that-is-at-least-32-characters-long!
          BETTER_AUTH_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:5173
        run: npm test

      - name: Run DB Persistence Tests
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
        run: npm run db:test

      - name: Verify Audit Chain Integrity
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/carnavales2027_test
        run: npm run audit:verify

      - name: Audit API Dependencies
        working-directory: api
        run: npm audit --audit-level=high

      - name: Install Client dependencies
        working-directory: client
        run: npm ci

      - name: Run Client Tests
        working-directory: client
        run: npm test

      - name: Build Client Production Bundle
        working-directory: client
        run: npm run build
